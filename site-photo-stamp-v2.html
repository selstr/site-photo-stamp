<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장사진 타임스탬프</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #1a1a1a;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #aaa;
    letter-spacing: 0.08em;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  /* 드롭존 */
  #dropzone {
    width: 100%;
    max-width: 480px;
    border: 2px dashed #444;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #242424;
    margin-bottom: 20px;
  }
  #dropzone:hover, #dropzone.drag-over {
    border-color: #f0a500;
    background: #2a2519;
  }
  #dropzone input { display: none; }
  #dropzone .icon { font-size: 2.8rem; margin-bottom: 10px; }
  #dropzone p { color: #888; font-size: 0.9rem; line-height: 1.6; }
  #dropzone strong { color: #f0a500; }

  /* 옵션 패널 */
  #options {
    width: 100%;
    max-width: 480px;
    background: #242424;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: none;
  }
  #options.visible { display: block; }

  .opt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 12px;
  }
  .opt-row:last-child { margin-bottom: 0; }
  .opt-label { font-size: 0.82rem; color: #999; white-space: nowrap; }

  select, input[type=color], input[type=range] {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.82rem;
  }
  select { flex: 1; }
  input[type=color] { width: 40px; height: 28px; padding: 2px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: #f0a500; }

  /* 미리보기 */
  #preview-wrap {
    width: 100%;
    max-width: 480px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #preview-wrap.visible { display: flex; }

  #canvas-wrap {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  canvas { display: block; width: 100%; height: auto; }

  /* 날짜 표시 */
  #exif-info {
    font-size: 0.8rem;
    color: #777;
    text-align: center;
  }
  #exif-info span { color: #f0a500; font-weight: 600; }

  /* 버튼 */
  #btn-download {
    width: 100%;
    max-width: 480px;
    background: #f0a500;
    color: #111;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }
  #btn-download:hover { background: #ffbc2e; }
  #btn-download.visible { display: block; }

  /* 다중 처리 */
  #batch-list {
    width: 100%;
    max-width: 480px;
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }
  #batch-list.visible { display: flex; }
  .batch-item {
    background: #2a2a2a;
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    color: #ccc;
  }
  .batch-item .status { color: #f0a500; font-size: 0.75rem; }
  .batch-item .status.done { color: #4caf50; }

  #btn-batch-download {
    width: 100%;
    max-width: 480px;
    background: #2e7d32;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }
  #btn-batch-download:hover { background: #388e3c; }
  #btn-batch-download.visible { display: block; }
</style>
</head>
<body>

<h1>현장사진 타임스탬프</h1>

<!-- 드롭존 -->
<div id="dropzone">
  <input type="file" id="file-input" accept="image/*" multiple>
  <div class="icon">📷</div>
  <p><strong>사진을 선택</strong>하거나 여기에 끌어다 놓으세요<br>
  EXIF 촬영일시를 자동으로 읽어 삽입합니다<br>
  <span style="font-size:0.78rem;color:#666">여러 장 동시 선택 가능</span></p>
</div>

<!-- 옵션 -->
<div id="options">
  <div class="opt-row">
    <span class="opt-label">글자 크기</span>
    <input type="range" id="opt-fontsize" min="10" max="60" value="28">
    <span id="opt-fontsize-val" style="font-size:0.78rem;color:#888;width:30px;text-align:right">28</span>
  </div>
  <div class="opt-row">
    <span class="opt-label">글자 색</span>
    <input type="color" id="opt-color" value="#ffffff">
    <span class="opt-label" style="margin-left:16px">배경</span>
    <input type="color" id="opt-bg" value="#000000">
    <input type="range" id="opt-alpha" min="0" max="100" value="55" style="width:60px">
    <span id="opt-alpha-val" style="font-size:0.78rem;color:#888;width:30px;text-align:right">55%</span>
  </div>
  <div class="opt-row">
    <span class="opt-label">위치</span>
    <select id="opt-pos">
      <option value="br" selected>우측 하단 (기본)</option>
      <option value="bl">좌측 하단</option>
      <option value="tr">우측 상단</option>
      <option value="tl">좌측 상단</option>
    </select>
  </div>
  <div class="opt-row">
    <span class="opt-label">형식</span>
    <select id="opt-fmt">
      <option value="datetime" selected>날짜 + 시간</option>
      <option value="date">날짜만</option>
    </select>
  </div>
</div>

<!-- EXIF 읽은 날짜 표시 -->
<div id="exif-info" style="margin-bottom:8px;display:none"></div>

<!-- 단일 미리보기 -->
<div id="preview-wrap">
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
</div>
<button id="btn-download">⬇ 저장</button>

<!-- 다중 파일 목록 -->
<div id="batch-list"></div>
<button id="btn-batch-download">⬇ 전체 저장 (ZIP)</button>

<script>
// ── 상태 ──────────────────────────────────────────
let files = [];
let currentImg = null;
let currentExifDate = null;

// ── DOM ───────────────────────────────────────────
const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('file-input');
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const optFontsize = document.getElementById('opt-fontsize');
const optFontsizeVal = document.getElementById('opt-fontsize-val');
const optColor    = document.getElementById('opt-color');
const optBg       = document.getElementById('opt-bg');
const optAlpha    = document.getElementById('opt-alpha');
const optAlphaVal = document.getElementById('opt-alpha-val');
const optPos      = document.getElementById('opt-pos');
const optFmt      = document.getElementById('opt-fmt');
const exifInfo    = document.getElementById('exif-info');
const previewWrap = document.getElementById('preview-wrap');
const batchList   = document.getElementById('batch-list');
const btnDownload = document.getElementById('btn-download');
const btnBatch    = document.getElementById('btn-batch-download');
const options     = document.getElementById('options');

// ── 드래그앤드롭 ──────────────────────────────────
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

// ── 옵션 변경 시 다시 그리기 ──────────────────────
[optFontsize, optColor, optBg, optAlpha, optPos, optFmt].forEach(el => {
  el.addEventListener('input', () => {
    optFontsizeVal.textContent = optFontsize.value;
    optAlphaVal.textContent = optAlpha.value + '%';
    if (currentImg && files.length === 1) drawStamp(currentImg, currentExifDate);
  });
});

// ── 파일 처리 ─────────────────────────────────────
function handleFiles(fileList) {
  files = Array.from(fileList);
  if (files.length === 0) return;

  options.classList.add('visible');

  if (files.length === 1) {
    // 단일 모드
    batchList.classList.remove('visible');
    btnBatch.classList.remove('visible');
    previewWrap.classList.add('visible');
    btnDownload.classList.add('visible');
    loadSingle(files[0]);
  } else {
    // 다중 모드
    previewWrap.classList.remove('visible');
    btnDownload.classList.remove('visible');
    showBatchList(files);
  }
}

// ── 단일 파일 ─────────────────────────────────────
function loadSingle(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    currentImg = img;
    readExif(file, date => {
      currentExifDate = date;
      showExifInfo(date, file);
      drawStamp(img, date);
    });
  };
  img.src = url;
}

// ── EXIF 읽기 ─────────────────────────────────────
function readExif(file, callback) {
  EXIF.getData(file, function() {
    const raw = EXIF.getTag(this, 'DateTimeOriginal') || EXIF.getTag(this, 'DateTime');
    let date = null;
    if (raw) {
      // "2025:06:15 14:32:07" 형식
      const [datePart, timePart] = raw.split(' ');
      if (datePart && timePart) {
        const [y, m, d] = datePart.split(':');
        const [hh, mm, ss] = timePart.split(':');
        date = new Date(y, m-1, d, hh, mm, ss);
      }
    }
    // EXIF 없으면 파일 수정일 사용
    if (!date || isNaN(date)) date = new Date(file.lastModified);
    callback(date);
  });
}

// ── EXIF 정보 표시 ────────────────────────────────
function showExifInfo(date, file) {
  exifInfo.style.display = 'block';
  exifInfo.innerHTML = `촬영일시 EXIF: <span>${formatDate(date)}</span>`;
}

// ── 날짜 포맷 ─────────────────────────────────────
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  const hh = String(date.getHours()).padStart(2,'0');
  const mm = String(date.getMinutes()).padStart(2,'0');
  const ss = String(date.getSeconds()).padStart(2,'0');
  if (optFmt.value === 'date') return `${y}.${m}.${d}`;
  return `${y}.${m}.${d}  ${hh}:${mm}:${ss}`;
}

// ── 스탬프 그리기 ─────────────────────────────────
function drawStamp(img, date) {
  canvas.width  = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx.drawImage(img, 0, 0);

  const fontSize = Math.round(img.naturalWidth * (parseInt(optFontsize.value) / 500));
  const text = formatDate(date);
  const font = `bold ${fontSize}px 'Courier New', monospace`;
  ctx.font = font;

  const pad = Math.round(fontSize * 0.5);
  const textW = ctx.measureText(text).width;
  const textH = fontSize;
  const bgPad = Math.round(fontSize * 0.35);

  // 위치
  let x, y;
  const pos = optPos.value;
  if (pos === 'br') { x = img.naturalWidth  - textW - pad - bgPad*2; y = img.naturalHeight - pad - bgPad*2; }
  else if (pos === 'bl') { x = pad; y = img.naturalHeight - pad - bgPad*2; }
  else if (pos === 'tr') { x = img.naturalWidth  - textW - pad - bgPad*2; y = pad + textH + bgPad; }
  else { x = pad; y = pad + textH + bgPad; }

  // 배경 박스
  const alpha = parseInt(optAlpha.value) / 100;
  const bgColor = hexToRgba(optBg.value, alpha);
  ctx.fillStyle = bgColor;
  ctx.beginPath();
  ctx.roundRect(x - bgPad, y - textH - bgPad, textW + bgPad*2, textH + bgPad*2, 6);
  ctx.fill();

  // 텍스트
  ctx.font = font;
  ctx.fillStyle = optColor.value;
  ctx.fillText(text, x, y);
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── 단일 다운로드 ─────────────────────────────────
btnDownload.addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/jpeg', 0.92);
  a.download = 'stamped_' + files[0].name.replace(/\.[^.]+$/, '') + '.jpg';
  a.click();
});

// ── 다중 파일 ─────────────────────────────────────
function showBatchList(fileArr) {
  batchList.innerHTML = '';
  batchList.classList.add('visible');
  btnBatch.classList.add('visible');

  fileArr.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'batch-item';
    item.id = 'batch-' + i;
    item.innerHTML = `<span>${f.name}</span><span class="status" id="st-${i}">대기중</span>`;
    batchList.appendChild(item);
  });
}

// ── 전체 저장 ─────────────────────────────────────
btnBatch.addEventListener('click', async () => {
  btnBatch.textContent = '처리 중...';
  btnBatch.disabled = true;

  const blobs = [];

  for (let i = 0; i < files.length; i++) {
    const st = document.getElementById('st-' + i);
    st.textContent = '처리 중...';

    const blob = await processFile(files[i]);
    blobs.push({ name: 'stamped_' + files[i].name.replace(/\.[^.]+$/, '') + '.jpg', blob });
    st.textContent = '완료';
    st.classList.add('done');
  }

  // ZIP 없이 순차 다운로드
  for (const { name, blob } of blobs) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    await new Promise(r => setTimeout(r, 300));
    URL.revokeObjectURL(url);
  }

  btnBatch.textContent = '⬇ 전체 저장';
  btnBatch.disabled = false;
});

function processFile(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      readExif(file, date => {
        const c = document.createElement('canvas');
        c.width  = img.naturalWidth;
        c.height = img.naturalHeight;
        const cx = c.getContext('2d');
        cx.drawImage(img, 0, 0);

        const fontSize = Math.round(img.naturalWidth * (parseInt(optFontsize.value) / 500));
        const text = formatDate(date);
        const font = `bold ${fontSize}px 'Courier New', monospace`;
        cx.font = font;

        const pad = Math.round(fontSize * 0.5);
        const textW = cx.measureText(text).width;
        const textH = fontSize;
        const bgPad = Math.round(fontSize * 0.35);

        let x, y;
        const pos = optPos.value;
        if (pos === 'br') { x = img.naturalWidth  - textW - pad - bgPad*2; y = img.naturalHeight - pad - bgPad*2; }
        else if (pos === 'bl') { x = pad; y = img.naturalHeight - pad - bgPad*2; }
        else if (pos === 'tr') { x = img.naturalWidth  - textW - pad - bgPad*2; y = pad + textH + bgPad; }
        else { x = pad; y = pad + textH + bgPad; }

        const alpha = parseInt(optAlpha.value) / 100;
        cx.fillStyle = hexToRgba(optBg.value, alpha);
        cx.beginPath();
        cx.roundRect(x - bgPad, y - textH - bgPad, textW + bgPad*2, textH + bgPad*2, 6);
        cx.fill();

        cx.font = font;
        cx.fillStyle = optColor.value;
        cx.fillText(text, x, y);

        c.toBlob(b => resolve(b), 'image/jpeg', 0.92);
        URL.revokeObjectURL(url);
      });
    };
    img.src = url;
  });
}
</script>
</body>
</html>
